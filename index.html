<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Solar System Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="info-panel">
    <h2 id="info-name">-</h2>
    <div class="row"><span>Orbital speed</span><span id="info-speed">-</span></div>
    <div class="row"><span id="info-distance-label">Distance</span><span id="info-distance">-</span></div>
    <div class="row"><span>Revolutions</span><span id="info-revolutions">-</span></div>
  </div>

  <div id="instructions">
    Click on a planet to zoom in and display its telemetry data. Click in the void to exit.
    <div class="author">Physics & Graphics Simulation by Marius FAKA</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
